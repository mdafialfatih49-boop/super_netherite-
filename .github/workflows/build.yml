      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: supernetherite-jar
          path: build/libs/supernetherite-*[0-9].jar
